name: Pipo para Android TV - compilar y probar

on:
  push:
    branches: ["ccr-87fb0d44-h5atsk"]
    paths:
      - "PipoAndroidTV/**"
      - "!PipoAndroidTV/capturas/**"
      - "!PipoAndroidTV/dist/**"
      - "PipoTV/src/**"
      - "PipoTV/public/**"
      - "PipoTV/package*.json"
      - ".github/workflows/pipo-androidtv.yml"
  workflow_dispatch:
    inputs:
      commit_apk:
        description: "Guardar el APK compilado en PipoAndroidTV/dist/ dentro del repositorio"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipo-androidtv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar en un emulador de Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: PipoTV/package-lock.json

      - name: Interfaz de la TV (la misma de LG webOS)
        working-directory: PipoTV
        run: npm ci --no-audit --no-fund && npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (release, firmado)
        working-directory: PipoAndroidTV
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p PipoAndroidTV/dist
          cp PipoAndroidTV/app/build/outputs/apk/release/app-release.apk PipoAndroidTV/dist/PipoMusicPlayer-AndroidTV.apk
          ls -l PipoAndroidTV/dist

      - uses: actions/upload-artifact@v4
        with:
          name: PipoMusicPlayer-AndroidTV-apk
          path: PipoAndroidTV/dist/PipoMusicPlayer-AndroidTV.apk
          if-no-files-found: error

      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pipo de prueba (canciones y servidor)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p /tmp/medios
          for i in 1 2 3; do
            ffmpeg -loglevel error -y -f lavfi -i "sine=frequency=$((330 + i * 110)):duration=60" -c:a libmp3lame -b:a 128k "/tmp/medios/t$i.mp3"
          done
          nohup node PipoAndroidTV/test/fake-pipo.mjs /tmp/medios > /tmp/fake-pipo.log 2>&1 &
          sleep 1
          curl -s http://127.0.0.1:37373/pipo/info

      - name: Probar en el emulador de Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash PipoAndroidTV/test/emulator-test.sh PipoAndroidTV/dist/PipoMusicPlayer-AndroidTV.apk capturas-androidtv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-androidtv
          path: capturas-androidtv
          if-no-files-found: ignore

      - name: Guardar capturas en el repositorio
        if: always()
        run: |
          rm -rf PipoAndroidTV/capturas && mkdir -p PipoAndroidTV/capturas
          for f in capturas-androidtv/*.png; do
            [ -s "$f" ] && ffmpeg -loglevel error -y -i "$f" -vf "scale='min(1280,iw)':-2" -q:v 4 "PipoAndroidTV/capturas/$(basename "${f%.png}").jpg"
          done
          cp capturas-androidtv/informe.txt capturas-androidtv/logcat.txt PipoAndroidTV/capturas/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A PipoAndroidTV/capturas
          if git commit -m "docs(PipoAndroidTV): capturas de la prueba en el emulador"; then
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Guardar APK en el repositorio
        if: github.event_name == 'workflow_dispatch' && inputs.commit_apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PipoAndroidTV/dist/PipoMusicPlayer-AndroidTV.apk
          git commit -m "build(PipoAndroidTV): APK compilado por CI"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
