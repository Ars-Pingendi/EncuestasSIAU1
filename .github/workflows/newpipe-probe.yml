name: Sonda NewPipeExtractor (temporal)

on:
  push:
    branches: ["ccr-87fb0d44-h5atsk"]
    paths:
      - ".github/workflows/newpipe-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clonar fuentes (solo lectura)
        run: |
          git clone -q --depth 1 https://github.com/TeamNewPipe/NewPipe np
          git clone -q --depth 1 --branch v0.27.0 https://github.com/TeamNewPipe/NewPipeExtractor npe
          echo "ok"

      - name: Cómo reproduce NewPipe YouTube
        run: |
          F=np/app/src/main/java/org/schabi/newpipe/player/datasource/YoutubeHttpDataSource.java
          echo "== YoutubeHttpDataSource 600-700"; sed -n '600,700p' $F
          echo "== YoutubeHttpDataSource 900-940"; sed -n '900,940p' $F
          echo "== Uso de la fábrica (setRange/setRn/YoutubeHttpDataSource.Factory)"
          grep -rn "YoutubeHttpDataSource.Factory\|setRangeParameterEnabled\|setRnParameterEnabled" np/app/src/main/java | head -20
          echo "== PoToken en la app"
          grep -rln "PoToken" np/app/src/main/java | head; grep -rn "setPoTokenProvider" np/app/src/main/java | head
          echo "== Selección de fuente para audio (DeliveryMethod/getAudioStreams)"
          grep -rn "DeliveryMethod\.\|isUrl()\|getContent()" np/app/src/main/java/org/schabi/newpipe/player/resolver | head -30

      - name: API del extractor v0.27.0 (fuentes)
        run: |
          B=npe/extractor/src/main/java/org/schabi/newpipe/extractor
          sig() { echo "== $1"; grep -nE "${2}" "$B/$1" | grep -vE '^\s*[0-9]+:\s*(\*|//)' | head -${3:-40}; }
          sig downloader/Downloader.java "public .*\(|abstract"
          sig downloader/Request.java "public [^=]*\(" 30
          sig downloader/Response.java "public [^=]*\(" 20
          sig NewPipe.java "public static .*\(" 20
          sig ServiceList.java "public static final"
          sig StreamingService.java "public .*(Search|LHFactory|QHFactory).*\(" 20
          sig search/SearchInfo.java "public static .*\(|public .* get" 20
          sig ListExtractor.java "public .*\(|class InfoItemsPage" 40
          sig InfoItem.java "public .*\(" 20
          sig stream/StreamInfoItem.java "public .*\(" 40
          sig stream/StreamInfo.java "public static .*\(|getAudioStreams" 20
          sig stream/AudioStream.java "public [^=]*\(" 40
          sig stream/Stream.java "public [^=]*\(" 30
          sig stream/DeliveryMethod.java "[A-Z_]+[,;]" 20
          sig stream/StreamType.java "[A-Z_]+[,;]" 20
          sig Image.java "public [^=]*\(" 20
          sig MediaFormat.java "^\s+[A-Z0-9_]+\(" 40
          sig localization/Localization.java "public Localization\(" 10
          sig localization/ContentCountry.java "public ContentCountry\(" 10
          sig linkhandler/LinkHandlerFactory.java "public .*getId|public .*fromUrl" 10
          sig linkhandler/SearchQueryHandlerFactory.java "public .*fromQuery" 10
          sig services/youtube/linkHandler/YoutubeSearchQueryHandlerFactory.java "public static final" 20
          sig services/youtube/YoutubeParsingHelper.java "public static .*(UserAgent|StreamingUrl|isVideoPlayback)" 30
          sig exceptions/ReCaptchaException.java "public ReCaptchaException" 5
          echo "== PoToken en el extractor"
          grep -rn "class .*PoToken\|interface .*PoToken\|setPoTokenProvider" $B | head -10
          grep -rn "poTokenProvider == null" $B | head -5
          echo "== Clientes usados para los streams"
          grep -rnE "fetch(Android|Ios|IOS|Tv|Web|VisionOs|AndroidVr)[A-Za-z]*\(" $B/services/youtube/extractors/YoutubeStreamExtractor.java | head -20

      - name: Artefacto en JitPack
        run: |
          for u in "com/github/TeamNewPipe/NewPipeExtractor/v0.27.0/NewPipeExtractor-v0.27.0.jar" "com/github/TeamNewPipe/NewPipeExtractor/v0.26.5/NewPipeExtractor-v0.26.5.jar"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://jitpack.io/$u"); echo "$code $u"
          done
